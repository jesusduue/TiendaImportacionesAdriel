<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Administrativo · Importaciones Adriel</title>
  <!-- Enlace privado del dueño: no indexar en buscadores -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23A6856A'/%3E%3Cpath d='M16 18h9l11 26 11-26h9L38 50h-10z' fill='%23FDFCFB'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="adm-page">

  <!-- ══════════ ACCESO (PIN) ══════════ -->
  <div id="admLogin" class="adm-login-wrap hidden">
    <div class="adm-login-card">
      <span class="pin-lock" aria-hidden="true">🔐</span>
      <h1>Panel Administrativo</h1>
      <p>Acceso restringido al propietario de la tienda.</p>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="8" class="input"
        style="text-align:center;font-size:1.4rem;letter-spacing:.5em;" placeholder="••••" aria-label="PIN" />
      <p class="pin-error hidden" id="pinError">PIN incorrecto. Intenta de nuevo.</p>
      <button class="btn btn-primary btn-block" id="pinSubmit">Entrar al panel</button>
      <a class="adm-back" href="index.html">← Volver a la tienda</a>
    </div>
  </div>

  <!-- ══════════ PANEL ══════════ -->
  <div id="admPanel" class="adm-panel hidden">
    <div class="adm-topbar">
      <div class="adm-topbar-inner">
        <div>
          <strong>⚙️ Panel Administrativo</strong>
          <span id="admStoreName">Importaciones Adriel</span>
        </div>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap">
          <a class="btn btn-ghost btn-sm" href="index.html" target="_blank" rel="noopener">👁 Ver tienda</a>
          <button class="btn btn-ghost btn-sm" id="admLogout">Cerrar sesión</button>
        </div>
      </div>
    </div>
    <div class="adm-container">
      <div id="adminBody"></div>
    </div>
  </div>

  <!-- Importar catálogo JSON -->
  <input type="file" id="importFile" accept=".json,application/json" style="display:none" />

  <!-- ══════════ TOASTS ══════════ -->
  <div class="toasts" id="toastBox" aria-live="polite" aria-label="Notificaciones"></div>

  <script src="js/art-engine.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>

</html>
